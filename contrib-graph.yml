name: Atualizar gráfico de contribuições

on:
  schedule:
    - cron: "0 6 * * *"   
  workflow_dispatch:      

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar gráfico
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: lianeiv
        run: python .github/scripts/contrib_graph.py

      - name: Commit do SVG atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          git diff --staged --quiet || (git commit -m "chore: atualiza gráfico de contribuições" && git push)
